<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>grading: Default</title>
    <link rel="stylesheet" href="/course-kit/components/styles/font.css" />
    <link rel="stylesheet" href="/course-kit/components/styles/prism-light.css" media="(prefers-color-scheme: light)" data-prism-theme="light" />
    <link rel="stylesheet" href="/course-kit/components/styles/prism-dark.css" media="(prefers-color-scheme: dark)" data-prism-theme="dark" />
    <link rel="stylesheet" href="/course-kit/components/styles/base.css" />
    <script src="/course-kit/components/preview-assets/tokens.js"></script>
  </head>
  <body>
    <main id="main-content" tabindex="-1" style="margin: 0; padding: 1rem; min-block-size: 0">
      <h1 class="sr-only">grading: Default</h1>

      <div class="wu6bknhkr">
        <table>
          <caption>
            Grade weighting
          </caption>
          <thead>
            <tr>
              <th scope="col">Category</th>
              <th scope="col">Weight</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Homework</td>
              <td>40%</td>
            </tr>
            <tr>
              <td>Tests</td>
              <td>40%</td>
            </tr>
            <tr>
              <td>Final exam</td>
              <td>20%</td>
            </tr>
          </tbody>
        </table>
        <table>
          <caption>
            Grading scale
          </caption>
          <thead>
            <tr>
              <th scope="col">Grade</th>
              <th scope="col">Weighted average</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>A</td>
              <td>
                <span>90 and above</span>
              </td>
            </tr>
            <tr>
              <td>B</td>
              <td>
                <span>80 and above</span>
              </td>
            </tr>
            <tr>
              <td>C</td>
              <td>
                <span>70 and above</span>
              </td>
            </tr>
            <tr>
              <td>D</td>
              <td>
                <span>60 and above</span>
              </td>
            </tr>
            <tr>
              <td>F</td>
              <td>
                <span>below 60</span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
