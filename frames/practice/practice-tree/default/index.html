<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>practice-tree: Tree question</title>
    <link rel="stylesheet" href="/course-kit/styles/font.css" />
    <link rel="stylesheet" href="/course-kit/styles/prism-light.css" media="(prefers-color-scheme: light)" data-prism-theme="light" />
    <link rel="stylesheet" href="/course-kit/styles/prism-dark.css" media="(prefers-color-scheme: dark)" data-prism-theme="dark" />

  <body>
    <main id="main-content" tabindex="-1" style="margin: 0; padding: 1rem; min-block-size: 0">
      <h1 class="sr-only">practice-tree: Tree question</h1>
      <practice-tree class="wz9o12pan">
        <div class="tree-question">
          <pre class="snippet"><code>&lt;ul&gt;&lt;li&gt;One&lt;/li&gt;&lt;/ul&gt;</code></pre>
          <ul class="dom-tree">
            <li style="--depth: 0">
              <span class="node">ul</span>
            </li>
            <li style="--depth: 1">
              <label class="node node-blank">
                <span class="sr-only">Blank 1 — the list item</span>
                <input type="text" autocomplete="off" spellcheck="false" size="8" name="2.3-blank-0" data-blank="0" />
              </label>
              <span hidden="" data-answer="li" class="answer-key">Answer: li</span>
            </li>
          </ul>
        </div>
      </practice-tree>
    </main>
  </body>
