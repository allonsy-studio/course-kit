<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>schedule-overview: Default</title>
    <link rel="stylesheet" href="/course-kit/styles/font.css" />
    <link rel="stylesheet" href="/course-kit/styles/prism-light.css" media="(prefers-color-scheme: light)" data-prism-theme="light" />
    <link rel="stylesheet" href="/course-kit/styles/prism-dark.css" media="(prefers-color-scheme: dark)" data-prism-theme="dark" />
    <link rel="stylesheet" href="/course-kit/styles/base.css" />
    <script src="/course-kit/preview-assets/tokens.js"></script>
  </head>
  <body>
    <main id="main-content" tabindex="-1" style="margin: 0; padding: 1rem; min-block-size: 0">
      <h1 class="sr-only">schedule-overview: Default</h1>

      <header class="schedule-overview wcqrkbqid">
        <p class="eyebrow separators">
          <span>Fall 2026</span>
          <span>CS101</span>
        </p>

        <h1>Schedule</h1>
        <p class="meets">
          <span>Tuesday &amp; Thursday</span>
          <span>10:00AM–11:15AM</span>
          <span>Science Hall 210</span>
        </p>

        <section aria-labelledby="schedule-key-dates" class="key-dates">
          <h2 id="schedule-key-dates">Key dates</h2>
          <div class="group">
            <h3>Tests</h3>
            <ul role="list">
              <li>
                <strong>Test 1</strong>
                <span class="when">Thursday, September 10, 2026</span>
              </li>
            </ul>
          </div>
        </section>

        <nav aria-label="Jump to" class="schedule-jump">
          <h2>Jump to</h2>
          <ul role="list">
            <li>
              <a href="#today" class="today-link">Today</a>
            </li>
            <li><a href="#week-1">August</a></li>
            <li><a href="#week-2">September</a></li>
          </ul>
        </nav>
      </header>
    </main>
  </body>
</html>
