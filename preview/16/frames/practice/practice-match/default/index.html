<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>practice-match: Match question</title>
    <link rel="stylesheet" href="/course-kit/preview/16/styles/font.css" />
    <link rel="stylesheet" href="/course-kit/preview/16/styles/prism-light.css" media="(prefers-color-scheme: light)" data-prism-theme="light" />
    <link rel="stylesheet" href="/course-kit/preview/16/styles/prism-dark.css" media="(prefers-color-scheme: dark)" data-prism-theme="dark" />
    <link rel="stylesheet" href="/course-kit/preview/16/styles/base.css" />
    <script src="/course-kit/preview/16/preview-assets/tokens.js"></script>
  </head>
  <body>
    <main id="main-content" tabindex="-1" style="margin: 0; padding: 1rem; min-block-size: 0">
      <h1 class="sr-only">practice-match: Match question</h1>
      <practice-match class="w7lezdw8n">
        <div class="matching">
          <ol class="bank">
            <li data-letter="A">
              <span class="letter">A</span>
              <span>A list of links</span>
            </li>
            <li data-letter="B">
              <span class="letter">B</span>
              <span>The page's footer</span>
            </li>
          </ol>
          <ol class="match-items">
            <li>
              <label>
                <span class="match-text">`nav`</span>
                <select name="1.2-match-0" data-blank="0">
                  <option value="">—</option>
                  <option value="A">A</option>
                  <option value="B">B</option>
                </select>
              </label>
              <span hidden="" data-answer="A" class="answer-key">
                <span>Answer: A</span>
              </span>
            </li>
            <li>
              <label>
                <span class="match-text">`footer`</span>
                <select name="1.2-match-1" data-blank="1">
                  <option value="">—</option>
                  <option value="A">A</option>
                  <option value="B">B</option>
                </select>
              </label>
              <span hidden="" data-answer="B" class="answer-key">
                <span>Answer: B</span>
              </span>
            </li>
          </ol>
        </div>
      </practice-match>
    </main>
  </body>
</html>
