<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>practice-judge: Judge question</title>
    <link rel="stylesheet" href="/course-kit/preview/23/components/styles/font.css" />
    <link rel="stylesheet" href="/course-kit/preview/23/components/styles/prism-light.css" media="(prefers-color-scheme: light)" data-prism-theme="light" />
    <link rel="stylesheet" href="/course-kit/preview/23/components/styles/prism-dark.css" media="(prefers-color-scheme: dark)" data-prism-theme="dark" />
    <link rel="stylesheet" href="/course-kit/preview/23/components/styles/base.css" />
    <script src="/course-kit/preview/23/components/preview-assets/tokens.js"></script>
  </head>
  <body>
    <main id="main-content" tabindex="-1" style="margin: 0; padding: 1rem; min-block-size: 0">
      <h1 class="sr-only">practice-judge: Judge question</h1>
      <practice-judge class="wuaj_gazx">
        <div class="judging">
          <div class="verdicts">
            <choice-list class="wybay1fzy">
              <fieldset>
                <legend>Verdict</legend>
                <label class="choice">
                  <input type="radio" name="3.1-choice" value="0" />
                  <span class="letter">A</span>
                  <span>Valid and correct</span>
                </label>
                <label class="choice">
                  <input type="radio" name="3.1-choice" value="1" />
                  <span class="letter">B</span>
                  <span>Invalid</span>
                </label>
              </fieldset>
            </choice-list>
          </div>
          <fieldset class="code-lines">
            <legend>Select the line that causes the problem</legend>
            <pre class="lines"><code><label class="code-line"><input type="radio" name="3.1-line" value="0"><span class="line-code"><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>ul</span><span class="token punctuation">></span></span></span></label>
<label class="code-line"><input type="radio" name="3.1-line" value="1"><span class="line-code"><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;</span>p</span><span class="token punctuation">></span></span>One<span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>p</span><span class="token punctuation">></span></span></span></label>
<label class="code-line"><input type="radio" name="3.1-line" value="2"><span class="line-code"><span class="token tag"><span class="token tag"><span class="token punctuation">&lt;/</span>ul</span><span class="token punctuation">></span></span></span></label></code></pre>
            <label class="code-line no-line">
              <input type="radio" name="3.1-line" value="none" />
              <span>No line — it is fine as written</span>
            </label>
          </fieldset>
        </div>
      </practice-judge>
    </main>
  </body>
</html>
