<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <title>slide-timetable: Default</title>
    <link rel="stylesheet" href="/course-kit/preview/27/components/styles/font.css" />
    <link rel="stylesheet" href="/course-kit/preview/27/components/styles/prism-light.css" media="(prefers-color-scheme: light)" data-prism-theme="light" />
    <link rel="stylesheet" href="/course-kit/preview/27/components/styles/prism-dark.css" media="(prefers-color-scheme: dark)" data-prism-theme="dark" />
    <link rel="stylesheet" href="/course-kit/preview/27/components/styles/base.css" />
    <script src="/course-kit/preview/27/components/preview-assets/tokens.js"></script>
  </head>
  <body>
    <main id="main-content" tabindex="-1" style="margin: 0; padding: 1rem; min-block-size: 0">
      <h1 class="sr-only">slide-timetable: Default</h1>

      <table data-today-host="timetable" class="slide-timetable wllvxxxpt">
        <caption class="sr-only">
          Every slide deck for this section, one row per week and one column per meeting day
        </caption>
        <thead>
          <tr>
            <th scope="col">Week</th>
            <th scope="col">Tuesday</th>
            <th scope="col">Thursday</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <th scope="row">
              <span class="week-title">Week <span>1</span></span>
              <span class="week-of">Aug 25–27</span>
            </th>
            <td data-day="Tuesday" data-date="2026-08-25">
              <p class="date">Aug 25</p>

              <p class="empty">No deck</p>
            </td>
            <td data-day="Thursday" data-date="2026-08-27">
              <p class="date">Aug 27</p>

              <p class="empty">No deck</p>
            </td>
          </tr>
          <tr>
            <th scope="row">
              <span class="week-title">Week <span>2</span></span>
              <span class="week-of">Sep 1–3</span>
            </th>
            <td data-day="Tuesday" data-date="2026-09-01">
              <p class="date">Sep 1</p>

              <p class="empty">No deck</p>
            </td>
            <td data-day="Thursday" data-date="2026-09-03">
              <p class="date">Sep 3</p>

              <p class="empty">No deck</p>
            </td>
          </tr>
          <tr>
            <th scope="row">
              <span class="week-title">Week <span>3</span></span>
              <span class="week-of">Sep 8–10</span>
            </th>
            <td data-day="Tuesday" data-date="2026-09-08">
              <p class="date">Sep 8</p>

              <p class="empty">No deck</p>
            </td>
            <td data-day="Thursday" data-date="2026-09-10">
              <p class="date">Sep 10</p>

              <p class="empty">No deck</p>
            </td>
          </tr>
        </tbody>
      </table>
    </main>
  </body>
</html>
