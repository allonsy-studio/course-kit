      .wybay1fzy {
        fieldset {
          border: 0;
          margin: 0;
          padding: 0;
        }

        legend {
          font-weight: var(--font-weight--semi-bold);
          padding-inline: 0;
        }

        .letter {
          background: var(--color-surface);
          border-radius: var(--standard-border-radius);
          display: inline-block;
          font-family: var(--mono-font);
          font-weight: var(--font-weight--semi-bold);
          min-inline-size: 1.7em;
          padding: 0.05em 0.35em;
          text-align: center;
          text-transform: uppercase;
        }

        label {
          align-items: baseline;
          border-radius: var(--standard-border-radius);
          cursor: pointer;
          display: flex;
          gap: 0.5em;
          padding: 0.25em 0.4em;

          &:hover {
            background: var(--color-accent-hover);
          }

          &[data-mark="right"] .letter {
            background: var(--color-success);
            color: var(--color-on-success);
          }

          &[data-mark="wrong"] .letter {
            background: var(--color-error);
            color: var(--color-on-error);
          }
        }
      }
      .whc6ijbve {
        legend {
          color: var(--color-text-muted);
          font-size: 0.85em;
          letter-spacing: 0.06em;
          padding-inline: 0;
          text-transform: uppercase;
        }

        .code-lines {
          border: 0;
          margin: 0;
          margin-block-start: var(--content-space);
          /* A fieldset defaults to min-content, which defeats the code's scroll. */
          min-inline-size: 0;
          padding: 0;
        }

        /* One label per line inside a <pre>, with nothing between the labels:
		   the HTML minifier leaves <pre> alone, which is what keeps the
		   snippet's indentation. */
        .lines {
          --token-string: color-mix(in oklab, var(--color-success) 60%, var(--color-text));
          background: var(--color-surface);
          border-radius: var(--standard-border-radius);
          font-size: 0.9em;
          margin: 0;
          overflow-x: auto;
          padding: 0.35em 0;

          /* A grid drops the whitespace-only text WebC leaves between the
			   looped labels, which a <pre> would otherwise show as blank lines. */
          code {
            background: none;
            display: grid;
            inline-size: max-content;
            min-inline-size: 100%;
            padding: 0;
          }

          .token:is(.comment, .prolog, .doctype, .cdata) {
            color: var(--color-text-muted);
            font-style: italic;
          }

          .token:is(.keyword, .builtin, .important, .atrule) {
            color: var(--color-accent-text);
            font-weight: var(--font-weight--semi-bold);
          }

          .token:is(.string, .char, .regex, .number, .boolean) {
            color: var(--token-string);
          }

          .token:is(.punctuation, .operator) {
            color: var(--color-text-muted);
          }
        }

        .code-line {
          align-items: center;
          border-inline-start: var(--thick-border-width) solid transparent;
          cursor: pointer;
          display: flex;
          gap: 0.6em;
          padding: 0.1em 0.6em;

          input {
            flex: none;
          }

          /* A blank line still gets a row the height of its neighbors. */
          .line-code {
            min-block-size: 1lh;
            white-space: pre;
          }

          &:hover {
            background: var(--color-accent-hover);
          }

          /* The chosen line lights up in the code itself. */
          &:has(input:checked) {
            background: color-mix(in srgb, var(--color-accent-text) 16%, transparent);
            border-inline-start-color: var(--color-accent-text);
          }

          &:has(input:focus-visible) {
            outline: var(--focus-ring-width) solid var(--color-focus-ring);
            outline-offset: calc(var(--focus-ring-width) * -1);
          }

          &.no-line {
            font-size: 0.9em;
            margin-block-start: 0.3em;
          }

          &[data-mark="right"],
          &[data-mark="right"]:has(input:checked) {
            background: color-mix(in srgb, var(--color-success) 22%, var(--color-page));
            border-inline-start-color: var(--color-success);
          }

          &[data-mark="wrong"],
          &[data-mark="wrong"]:has(input:checked) {
            background: color-mix(in srgb, var(--color-error) 22%, var(--color-page));
            border-inline-start-color: var(--color-error);
          }
        }
      }

    <script>
      window.ckCopy ??= (function () {
        var data = JSON.parse(document.getElementById("copy-data")?.textContent || "{}");
        var rules = new Intl.PluralRules(document.documentElement.lang || "en-US");
        function t(ns, key, vars) {
          vars = vars || {};
          var table = data[ns] || {};
          var text = table[key];
          if ("count" in vars) if (key + "_other" in table) text = table[key + "_" + rules.select(vars.count)] ?? table[key + "_other"];
          return String(text ?? "").replace(/\{(\w+)\}/g, function (match, name) {
            return String(vars[name] ?? "");
          });
        }
        return { data: data, t: t };
      })();
    </script>

    <script type="module">
      // assets/scripts/practice.js
      var { t } = window.ckCopy;
      var normalize = (value) =>
        value
          .toLowerCase()
          .replaceAll(/[<>/]/g, "")
          .replaceAll(/[·,;|]+/g, " ")
          .replaceAll(/\s+/g, " ")
          .trim();
      window.practice = { normalize };
      var rootOf = (element) => element.closest("[data-worksheet]");
      var questionsIn = (root, scope) => {
        const region = root.matches(scope) ? root : root.querySelector(scope);
        return [...(region?.querySelectorAll(".question") ?? [])];
      };
      var checkedValue = (question, name) => {
        const input = question.querySelector(`input[name="${name}"]:checked`);
        return input ? input.value : null;
      };
      var mark = (element, correct) => {
        if (!element) return;
        element.dataset.mark = correct ? "right" : "wrong";
        const key = element.querySelector(".answer-key");
        if (key) key.hidden = correct;
      };
      var clearMarks = (question) => {
        for (const marked of question.querySelectorAll("[data-mark]")) delete marked.dataset.mark;
        for (const key of question.querySelectorAll(".answer-key")) key.hidden = true;
      };
      var GRADERS = {
        choice(question, key, id) {
          const picked = checkedValue(question, `${id}-choice`);
          if (picked === null) return { answered: false, right: 0, total: 1, blank: 1 };
          for (const label of question.querySelectorAll(".choice")) {
            const value = Number(label.querySelector("input").value);
            if (value === key.answer) mark(label, true);
            else if (value === Number(picked)) mark(label, false);
          }
          return { answered: true, right: Number(picked) === key.answer ? 1 : 0, total: 1, blank: 0 };
        },
        match(question, key) {
          let right = 0;
          let blank = 0;
          let answered = false;
          for (const [index, expected] of key.items.entries()) {
            const select = question.querySelector(`select[data-blank="${index}"]`);
            if (!select.value) {
              blank += 1;
              continue;
            }
            answered = true;
            const correct = select.value === expected;
            if (correct) right += 1;
            mark(select.closest("li"), correct);
          }
          return { answered, right, total: key.items.length, blank };
        },
        fill(question, key) {
          let right = 0;
          let blank = 0;
          let answered = false;
          for (const [index, accepted] of key.blanks.entries()) {
            const input = question.querySelector(`input[data-blank="${index}"]`);
            if (!input.value.trim()) {
              blank += 1;
              continue;
            }
            answered = true;
            const typed = normalize(input.value);
            const correct = accepted.some((option) => normalize(option) === typed);
            if (correct) right += 1;
            mark(input.closest("li"), correct);
          }
          return { answered, right, total: key.blanks.length, blank };
        },
        grid(question, key, id) {
          let right = 0;
          let blank = 0;
          let answered = false;
          for (const [index, expected] of key.rows.entries()) {
            const picked = checkedValue(question, `${id}-row-${index}`);
            if (picked === null) {
              blank += 1;
              continue;
            }
            answered = true;
            const correct = Number(picked) === expected;
            if (correct) right += 1;
            mark(question.querySelector(`tr[data-row="${index}"]`), correct);
          }
          return { answered, right, total: key.rows.length, blank };
        },
        judge(question, key, id) {
          const verdict = checkedValue(question, `${id}-choice`);
          const line = checkedValue(question, `${id}-line`);
          if (verdict === null && line === null) return { answered: false, right: 0, total: 2, blank: 2 };
          let right = 0;
          for (const label of question.querySelectorAll(".verdicts .choice")) {
            const value = Number(label.querySelector("input").value);
            if (value === key.answer) mark(label, true);
            else if (value === Number(verdict)) mark(label, false);
          }
          if (Number(verdict) === key.answer) right += 1;
          const expected = key.lines.length ? key.lines.map(String) : ["none"];
          for (const label of question.querySelectorAll(".code-lines .code-line")) {
            const value = label.querySelector("input").value;
            if (expected.includes(value)) mark(label, true);
            else if (value === line) mark(label, false);
          }
          if (line !== null && expected.includes(line)) right += 1;
          return { answered: true, right, total: 2, blank: (verdict === null ? 1 : 0) + (line === null ? 1 : 0) };
        },
      };
      GRADERS.tree = GRADERS.fill;
      var STATUS_KEY = {
        unattempted: "statusUnattempted",
        answered: "statusAnswered",
        right: "statusRight",
        wrong: "statusWrong",
        partial: "statusPartial",
        self: "statusSelf",
      };
      var isGradable = (question) => question.dataset.kind in GRADERS;
      var hasValue = (question) => [...question.querySelectorAll("input[type='radio']")].some((input) => input.checked) || [...question.querySelectorAll("input[type='text'], select")].some((control) => control.value.trim() !== "");
      var setState = (question, state) => {
        question.dataset.state = state;
      };
      function clearFeedback(question) {
        clearMarks(question);
        const feedback = question.querySelector(".feedback");
        feedback.hidden = true;
        feedback.textContent = "";
        question.querySelector(".why").hidden = true;
      }
      function check(question) {
        if (!isGradable(question)) {
          const reveal = question.querySelector("[data-reveal]");
          if (reveal) reveal.open = true;
          return "self";
        }
        const { kind, question: id } = question.dataset;
        clearMarks(question);
        const { answered, right, total, blank } = GRADERS[kind](question, JSON.parse(question.dataset.answers ?? "{}"), id);
        const feedback = question.querySelector(".feedback");
        const why = question.querySelector(".why");
        feedback.hidden = false;
        if (!answered) {
          setState(question, "unattempted");
          feedback.textContent = t("worksheet", "feedbackUnattempted");
          why.hidden = true;
          return "unattempted";
        }
        const wrong = total - right - blank > 0;
        const state = right === total ? "right" : wrong ? "wrong" : "partial";
        setState(question, state);
        feedback.textContent = state === "right" ? (total > 1 ? t("worksheet", "feedbackRightAll", { total }) : t("worksheet", "feedbackRight")) : t("worksheet", "feedbackParts", { right, total }) + (blank > 0 ? t("common", "sep") + t("worksheet", "feedbackBlank", { count: blank }) : "");
        why.hidden = false;
        return state;
      }
      function reset(question) {
        clearFeedback(question);
        for (const input of question.querySelectorAll("input[type='radio']")) input.checked = false;
        for (const input of question.querySelectorAll("input[type='text']")) input.value = "";
        for (const select of question.querySelectorAll("select")) select.value = "";
        for (const row of question.querySelectorAll("[data-dropped], [data-over]")) {
          delete row.dataset.dropped;
          delete row.dataset.over;
        }
        markUsedWords(question);
        for (const details of question.querySelectorAll("[data-reveal]")) details.open = false;
        setState(question, isGradable(question) ? "unattempted" : "self");
